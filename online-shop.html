<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280"><title>Online Shop | পণ্য দেখুন ও Cash on Delivery অর্ডার করুন</title>
<meta name="description" content="অনলাইন শপে পণ্য দেখুন, দাম ও স্টক যাচাই করুন এবং অনলাইনে অর্ডার সাবমিট করুন।">

<meta name="googlebot" content="index, follow">
<meta name="keywords" content="online shop, online shopping, cash on delivery, পণ্য, অনলাইন শপ">
<meta property="og:type" content="website">
<meta property="og:title" content="Online Shop | Cash on Delivery">
<meta property="og:description" content="পণ্য দেখুন, দাম ও স্টক যাচাই করুন এবং অনলাইনে Cash on Delivery অর্ডার সাবমিট করুন।">

<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4f7;color:#20252b;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.head{background:#fff;padding:16px;border-radius:14px;box-shadow:0 2px 12px #0001;display:flex;align-items:center;gap:14px;margin-bottom:16px}.logo{width:78px;height:78px;object-fit:contain;display:none}.brand h1{margin:0;color:#173f67;font-size:24px}.muted{color:#66717d;font-size:13px;margin-top:5px}.status{font-size:13px;margin:8px 0;color:#5c6670}.tools{display:flex;gap:8px;margin:12px 0}.tools input{flex:1;min-width:0;padding:11px;border:1px solid #ccd3db;border-radius:8px;font-size:15px}.btn{border:0;border-radius:8px;padding:11px 15px;background:#173f67;color:#fff;font-weight:bold;cursor:pointer}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}.product{background:white;border-radius:12px;padding:14px;box-shadow:0 2px 10px #0001;display:flex;flex-direction:column;gap:7px}.product h3{font-size:16px;margin:0}.code{font-size:12px;color:#718096}.price{font-weight:bold;color:#173f67;font-size:18px}.stock{font-size:12px;color:#16803d}.stock.out{color:#b42318}.product button{margin-top:auto}.cart{background:#fff;border-radius:12px;padding:16px;margin-top:18px;box-shadow:0 2px 10px #0001}.cart h2{margin:0 0 10px}.line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #e7eaee}.line small{color:#66717d}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.fields input,.fields textarea{width:100%;padding:10px;border:1px solid #ccd3db;border-radius:8px;font:inherit}.fields textarea{grid-column:1/-1;min-height:65px}.total{font-size:19px;font-weight:bold;text-align:right;margin:12px 0}.empty{text-align:center;background:white;padding:28px;border-radius:12px;color:#66717d}@media(max-width:560px){.wrap{padding:8px}.head{padding:12px}.logo{width:58px;height:58px}.brand h1{font-size:20px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product{padding:10px}.fields{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="head"><img id="logo" class="logo" alt="Company logo"><div class="brand"><h1 id="shop">Online Shop</h1><div id="info" class="muted"></div><div class="muted">Home Delivery / Shop Collection • Cash Payment</div></div></header><div id="status" class="status">Loading products…</div><div class="tools"><input id="search" placeholder="Search products…" oninput="renderProducts()"><button class="btn" onclick="loadStore()">Refresh</button></div><section id="products" class="products"></section><section class="cart"><h2>Your Order (<span id="count">0</span>)</h2><div id="cartLines"><div class="muted">No products selected.</div></div><div id="total" class="total">Total: 0.00 OMR</div><div class="fields"><input id="customer" placeholder="Your name"><input id="phone" placeholder="Phone number" inputmode="tel"><select id="fulfillment" onchange="toggleAddress()" style="grid-column:1/-1;padding:10px;border:1px solid #ccd3db;border-radius:8px;font:inherit"><option value="delivery">Home Delivery</option><option value="pickup">Shop Collection</option></select><textarea id="address" placeholder="Delivery address"></textarea></div><button class="btn" style="width:100%;margin-top:12px" onclick="placeOrder()">Submit Order</button><div class="muted">Your order will be submitted directly to the shop system. Stock is reduced only after the order is accepted and marked Delivered.</div></section><div class="muted" style="text-align:center;padding:18px">Powered by Online Shop</div></main>
<script>
const SUPABASE_URL='https://pxfcrovaikcawhfbqkpd.supabase.co';
const SUPABASE_KEY='sb_publishable_0MDeM_nC7PWkobb4OKz9Og_HnvoTf-T';
const CLOUD_ID=1;let db={settings:{shop:'Online Shop',currency:'OMR'},products:[]};let cart={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadStore(){const st=document.getElementById('status');st.textContent='Loading products from cloud…';try{const r=await fetch(SUPABASE_URL+'/rest/v1/hr_shared_data?id=eq.'+CLOUD_ID+'&select=data',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw Error('Cloud response '+r.status);const rows=await r.json();if(!rows.length||!rows[0].data)throw Error('Shop data not found');db=rows[0].data;db.settings=db.settings||{};db.products=Array.isArray(db.products)?db.products:[];document.getElementById('shop').textContent=db.settings.shop||'Online Shop';document.getElementById('info').textContent=[db.settings.address,db.settings.phone].filter(Boolean).join(' • ');const logo=document.getElementById('logo');if(db.settings.logo){logo.src=db.settings.logo;logo.style.display='block'}else{logo.removeAttribute('src');logo.style.display='none'}st.textContent='Products updated from cloud • '+db.products.length+' product(s)';renderProducts();renderCart()}catch(e){console.error(e);st.textContent='Products unavailable. Please open after the shop Cloud Sync is working.';document.getElementById('products').innerHTML='<div class="empty">Could not load products. Please try Refresh later.</div>'}}
function renderProducts(){const q=document.getElementById('search').value.trim().toLowerCase();const list=(db.products||[]).filter(p=>(String(p.name||'')+' '+String(p.code||'')).toLowerCase().includes(q));document.getElementById('products').innerHTML=list.map(p=>{const code=String(p.code||'');const stock=Number(p.stock||0);return `<article class="product">${p.photo?`<img src="${p.photo}" alt="${esc(p.name||'Product')}" loading="lazy" style="width:100%;height:145px;object-fit:cover;border-radius:8px;background:#f1f4f7">`:`<div style="height:145px;display:flex;align-items:center;justify-content:center;background:#f1f4f7;border-radius:8px;color:#98a2b3;font-size:13px">No photo</div>`}<div class="code">${esc(code)}</div><h3>${esc(p.name||'Product')}</h3><div class="price">${Number(p.sell||0).toFixed(2)} ${esc(db.settings.currency||'OMR')}</div><div class="stock ${stock<=0?'out':''}">${stock>0?'In stock: '+stock+' '+esc(p.unit||'pcs'):'Out of stock'}</div><button class="btn" ${stock<=0?'disabled':''} onclick="addCart('${code.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">Add to cart</button></article>`}).join('')||'<div class="empty">No products found.</div>'}
function addCart(code){const p=db.products.find(x=>String(x.code)===String(code));if(!p)return;cart[code]=Math.min(Number(cart[code]||0)+1,Number(p.stock||0));renderCart()}
function changeQty(code,delta){const p=db.products.find(x=>String(x.code)===String(code));if(!p)return;cart[code]=Math.max(0,Math.min(Number(cart[code]||0)+delta,Number(p.stock||0)));if(!cart[code])delete cart[code];renderCart()}
function renderCart(){let rows=Object.entries(cart).filter(([c,q])=>q>0).map(([c,q])=>{const p=db.products.find(x=>String(x.code)===c);return p?{p,q}:null}).filter(Boolean);document.getElementById('count').textContent=rows.reduce((n,x)=>n+x.q,0);document.getElementById('cartLines').innerHTML=rows.map(({p,q})=>`<div class="line"><div><b>${esc(p.name)}</b><br><small>${Number(p.sell||0).toFixed(2)} × ${q}</small></div><div><button onclick="changeQty('${String(p.code).replace(/'/g,"\\'")}',-1)">−</button><b>${q}</b><button onclick="changeQty('${String(p.code).replace(/'/g,"\\'")}',1)">+</button></div></div>`).join('')||'<div class="muted">No products selected.</div>';const sum=rows.reduce((n,x)=>n+x.q*Number(x.p.sell||0),0);document.getElementById('total').textContent='Total: '+sum.toFixed(2)+' '+(db.settings.currency||'OMR')}
function toggleAddress(){const f=document.getElementById('fulfillment').value;const a=document.getElementById('address');a.style.display=f==='pickup'?'none':'block';a.required=f!=='pickup';if(f==='pickup')a.value='Shop Collection'}
async function placeOrder(){const rows=Object.entries(cart).filter(([c,q])=>q>0).map(([c,q])=>{const p=db.products.find(x=>String(x.code)===c);return p?{p,q}:null}).filter(Boolean);const name=document.getElementById('customer').value.trim(),phone=document.getElementById('phone').value.trim();let address=document.getElementById('address').value.trim();const fulfillment=document.getElementById('fulfillment').value;if(!rows.length)return alert('Please add products to cart.');if(!name||!phone)return alert('Please enter your name and phone number.');if(fulfillment==='delivery'&&!address)return alert('Please enter your delivery address.');if(fulfillment==='pickup')address='Shop Collection';for(const x of rows)if(x.q>Number(x.p.stock||0))return alert('Stock changed for '+x.p.name+'. Please refresh.');const total=rows.reduce((n,x)=>n+x.q*Number(x.p.sell||0),0);const order={id:'ORD-'+Date.now().toString().slice(-8),createdAt:new Date().toLocaleString(),customer:name,phone,address,fulfillment,status:'pending',payment:'Cash',total,items:rows.map(x=>({code:String(x.p.code),name:x.p.name,qty:Number(x.q),price:Number(x.p.sell||0),lineTotal:Number((x.q*Number(x.p.sell||0)).toFixed(2))}))};try{const r=await fetch(SUPABASE_URL+'/rest/v1/hr_shared_data?id=eq.'+CLOUD_ID+'&select=id,data',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(!r.ok)throw Error('Could not read shop cloud ('+r.status+')');const list=await r.json();if(!list.length||!list[0].data)throw Error('Shop cloud data not found');const latest=list[0].data;latest.orders=Array.isArray(latest.orders)?latest.orders:[];if(latest.orders.some(o=>o.id===order.id))throw Error('Duplicate order ID');latest.orders.push(order);const wr=await fetch(SUPABASE_URL+'/rest/v1/hr_shared_data?id=eq.'+CLOUD_ID,{method:'PATCH',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({data:latest,updated_at:new Date().toISOString()})});if(!wr.ok)throw Error('Could not save order to cloud ('+wr.status+'). Check Supabase update permissions.');alert('Order submitted successfully! Order ID: '+order.id+'. The shop will review and accept it. Stock will change only after delivery.');cart={};renderCart();document.getElementById('customer').value='';document.getElementById('phone').value='';if(fulfillment==='delivery')document.getElementById('address').value='';await loadStore();}catch(e){console.error(e);alert('Order was not saved to the shop system. '+e.message+' Please contact the shop or try again.');}}
toggleAddress();loadStore();setInterval(loadStore,45000);
</script></body></html>
