<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GP Vegetable & Fruit - Menu Builder</title>
<style>
:root{--g:#087d3e;--lg:#dff4dc;--red:#d92828;--bd:#b7dfb5}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5fbf3;color:#173523}
header{background:linear-gradient(110deg,#d8f5d7,#fff);padding:16px;border-bottom:3px solid #a7dca4}.head{max-width:1200px;margin:auto;display:flex;gap:14px;align-items:center}.logo{width:78px;height:78px;border:2px solid #8fc991;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:bold;color:var(--g);text-align:center}.logo img{width:100%;height:100%;object-fit:contain}.head h1{margin:0;color:var(--g);font-size:clamp(24px,5vw,40px)}.head p{margin:5px 0;color:#456b4e}
.wrap{max-width:1200px;margin:auto;padding:12px}.settings,.toolbar{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}.settings{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.settings label{font-size:12px;font-weight:bold;color:#396647}.settings input{width:100%;margin-top:4px;padding:10px;border:1px solid var(--bd);border-radius:9px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:5}.toolbar input{flex:1;min-width:180px;padding:11px;border:1px solid var(--bd);border-radius:9px}.toolbar button,.primary{border:0;border-radius:9px;padding:11px 14px;background:var(--g);color:#fff;font-weight:bold}.toolbar .light{background:#e2f3df;color:#17582f}
h2{background:#d8f2d6;color:var(--g);border-radius:12px;padding:9px 13px;font-size:21px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:7px}.pic{height:125px;background:#eaf6e8;border-radius:8px;overflow:hidden;text-align:center}.pic img{width:100%;height:100%;object-fit:cover}.pic span{display:block;padding-top:48px;color:#638168;font-size:12px}.row{display:flex;align-items:center;gap:7px;margin:7px 0}.name{font-weight:bold;flex:1}.card input[type=number]{width:74px;padding:7px;border:1px solid var(--bd);border-radius:7px}.card .offer{width:74px}.check{width:18px;height:18px}.status{font-size:11px;color:#5c7861;min-height:14px}
#qrbox{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;border-radius:16px;padding:18px;max-width:430px;width:100%;text-align:center}.modal canvas{max-width:100%;height:auto}.modal .url{font-size:11px;word-break:break-all;background:#f2f5f2;padding:7px;margin:8px 0}.close{background:#555!important}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.settings{grid-template-columns:1fr 1fr}}@media(max-width:500px){.settings{grid-template-columns:1fr}.grid{gap:7px}.pic{height:115px}}
@media print{.toolbar,.settings,#qrbox{display:none!important}.grid{grid-template-columns:repeat(5,1fr)}.card{break-inside:avoid}.pic{height:95px}}
</style></head>
<body>
<header><div class="head"><div class="logo" id="logoBox">YOUR<br>LOGO</div><div><h1 id="shopTitle">GP Vegetable & Fruit</h1><p id="shopAddress">Your shop address</p></div></div></header>
<div class="wrap">
<section class="settings">
<label>Shop Name<input id="shopName" value="GP Vegetable & Fruit"></label>
<label>Shop Address<input id="address" placeholder="Enter shop address"></label>
<label>Shop Logo<input id="logo" type="file" accept="image/*"></label>
</section>
<div class="toolbar"><input id="search" placeholder="Search item..."><button class="light" onclick="selectVisible(true)">Select visible</button><button class="light" onclick="selectVisible(false)">Clear visible</button><button onclick="makePDF()">PDF of Selected</button><button onclick="makeQR()">Create Customer QR</button></div>
<section><h2>Vegetables</h2><div class="grid" id="veg"></div></section>
<section><h2>Fruits</h2><div class="grid" id="fruit"></div></section>
</div>
<div id="qrbox"><div class="modal"><h3>Customer QR Code</h3><div id="qr"></div><div class="url" id="shareUrl"></div><button onclick="window.print()">Print QR</button> <button class="close" onclick="qrbox.style.display='none'">Close</button><p style="font-size:12px">Upload both HTML files to the same GitHub Pages folder. The QR opens menu.html with the selected items and prices.</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const V=["Tomato","Potato","Red Onion","White Onion","Garlic","Ginger","Carrot","Cabbage","Cauliflower","Green Chili","Red Chili","Brinjal","Okra","Spinach","Cucumber","Broccoli","Green Capsicum","Red Capsicum","Yellow Capsicum","Pumpkin","Lettuce","Beetroot","Radish","Sweet Potato","Green Peas","Corn","Mushroom","Lemon","Zucchini","Bottle Gourd","Bitter Gourd","Snake Gourd","Ridge Gourd","Drumstick","Green Beans","Long Beans","Spring Onion","Leek","Celery","Parsley","Coriander","Mint","Dill","Turnip","Yam","Taro Root","Asparagus","Artichoke","Kale","Brussels Sprouts","Chinese Cabbage","Red Cabbage","Chayote","Green Papaya","Raw Banana","Shallot","Fennel Bulb","Fenugreek Leaves","Curry Leaves","Arugula"];
const F=["Apple","Banana","Orange","Mango","Green Grapes","Red Grapes","Watermelon","Pear","Pineapple","Guava","Pomegranate","Strawberry","Dates","Papaya","Kiwi","Avocado","Peach","Cherry","Coconut","Blueberry","Muskmelon","Honeydew Melon","Plum","Lime","Dragon Fruit","Jackfruit","Rambutan","Lychee","Longan","Mandarin","Grapefruit","Lemon","Sweet Lime","Persimmon","Apricot","Fig","Passion Fruit","Custard Apple","Sapodilla","Star Fruit","Blackberry","Raspberry","Cranberry","Mulberry","Pomelo","Mangosteen","Durian","Breadfruit","Quince","Nectarine","Prickly Pear","Tamarind","Indian Gooseberry","Wood Apple","Rose Apple","Soursop","Cantaloupe","Red Banana","Plantain","Yellow Watermelon"];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function card(name){let d=document.createElement("div");d.className="card";d.dataset.name=name.toLowerCase();d.innerHTML=`<div class="pic"><span>Loading photo…</span></div><div class="row"><input class="check" type="checkbox"><div class="name">${esc(name)}</div></div><div class="row"><label>Price</label><input class="price" type="number" step="0.001" min="0" placeholder="0.00"><label>Offer</label><input class="offer" type="number" step="0.001" min="0" placeholder="—"></div><div class="status"></div>`;loadPhoto(name,d.querySelector(".pic"),d.querySelector(".status"));return d}
async function loadPhoto(name,box,status){try{let u="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent("file "+name)+"&gsrnamespace=6&gsrlimit=3&prop=imageinfo&iiprop=url&iiurlwidth=500&format=json&origin=*";let j=await fetch(u).then(r=>r.json());let a=Object.values(j?.query?.pages||{}).map(x=>x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url).filter(Boolean);if(!a.length){box.innerHTML="<span>Photo unavailable</span>";return}let im=new Image();im.onload=()=>{box.innerHTML="";box.appendChild(im)};im.onerror=()=>box.innerHTML="<span>Photo unavailable</span>";im.src=a[0]}catch(e){box.innerHTML="<span>Photo unavailable</span>"}}
function fill(id,list){let el=document.getElementById(id);list.forEach(n=>el.appendChild(card(n)))}fill("veg",V);fill("fruit",F);
document.getElementById("search").oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll(".card").forEach(c=>c.style.display=c.dataset.name.includes(q)?"":"none")};
function selectVisible(v){document.querySelectorAll(".card").forEach(c=>{if(c.style.display!=="none")c.querySelector(".check").checked=v})}
function selected(){return [...document.querySelectorAll(".card")].filter(c=>c.querySelector(".check").checked).map(c=>({n:c.querySelector(".name").textContent,p:c.querySelector(".price").value,o:c.querySelector(".offer").value||""}))}
function compress(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function makeData(){return {s:document.getElementById("shopName").value||"GP Vegetable & Fruit",a:document.getElementById("address").value||"",i:selected()}}
function customerUrl(){return location.href.replace(/index\.html?(#.*)?$/,"menu.html")+"#data="+compress(makeData())}
function makeQR(){let items=selected();if(!items.length){alert("Select at least one item and enter its price.");return}let u=customerUrl();qr.innerHTML="";new QRCode(qr,{text:u,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});shareUrl.textContent=u;qrbox.style.display="flex"}
function makePDF(){if(!selected().length){alert("Select items first.");return}window.print()}
shopName.oninput=()=>shopTitle.textContent=shopName.value||"GP Vegetable & Fruit";address.oninput=()=>shopAddress.textContent=address.value||"Your shop address";
logo.onchange=e=>{let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>logoBox.innerHTML=`<img src="${r.result}" alt="Logo">`;r.readAsDataURL(f)}
</script></body></html>
