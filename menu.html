<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Fresh Offers</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5fbf3;color:#173523}.head{padding:18px;text-align:center;background:linear-gradient(110deg,#d8f5d7,#fff);border-bottom:3px solid #a7dca4}.head h1{margin:0;color:#087d3e;font-size:clamp(26px,6vw,42px)}.head p{margin:7px;color:#456b4e}.wrap{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid #b7dfb5;border-radius:12px;overflow:hidden;text-align:center}.pic{height:170px;background:#e7f4e4}.pic img{width:100%;height:100%;object-fit:cover}.name{font-weight:bold;font-size:16px;margin:9px 5px}.price{font-size:14px;color:#42604a}.offer{font-weight:bold;color:#d92828;margin:5px}.unit{font-size:11px;color:#426c49;background:#d1efcd;display:inline-block;padding:4px 9px;border-radius:20px;margin-bottom:10px}.empty{text-align:center;padding:40px;background:#fff;border-radius:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:145px}}
</style></head><body>
<header class="head"><h1 id="title">Fresh Vegetables & Fruits</h1><p id="address"></p><p>Fresh & Healthy • Special Offers</p></header>
<main class="wrap"><div id="content" class="grid"></div></main>
<script>
function decode(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))}
function loadPhoto(name,box){let u="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent("file "+name)+"&gsrnamespace=6&gsrlimit=3&prop=imageinfo&iiprop=url&iiurlwidth=600&format=json&origin=*";fetch(u).then(r=>r.json()).then(j=>{let a=Object.values(j?.query?.pages||{}).map(x=>x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url).filter(Boolean);if(!a.length){box.textContent="Photo unavailable";return}let im=new Image();im.onload=()=>{box.innerHTML="";box.appendChild(im)};im.src=a[0]}).catch(()=>box.textContent="Photo unavailable")}
let raw=location.hash.match(/data=([^&]+)/);let content=document.getElementById("content");if(!raw){content.innerHTML='<div class="empty">No menu data found.</div>'}else{try{let d=decode(raw[1]);title.textContent=d.s||"Fresh Vegetables & Fruits";address.textContent=d.a||"";if(!d.i.length){content.innerHTML='<div class="empty">No items selected.</div>'}d.i.forEach(x=>{let c=document.createElement("article");c.className="card";let p=document.createElement("div");p.className="pic";p.textContent="Loading photo…";c.appendChild(p);let n=document.createElement("div");n.className="name";n.textContent=x.n;c.appendChild(n);let pr=document.createElement("div");pr.className="price";pr.textContent="Price: "+(x.p||"—");c.appendChild(pr);if(x.o){let of=document.createElement("div");of.className="offer";of.textContent="Offer: "+x.o;c.appendChild(of)}let un=document.createElement("div");un.className="unit";un.textContent="KG • PCS • BOX";c.appendChild(un);content.appendChild(c);loadPhoto(x.n,p)})}catch(e){content.innerHTML='<div class="empty">Invalid menu link.</div>'}}
</script></body></html>
